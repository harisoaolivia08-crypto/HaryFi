<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HaryFi – Lektion 1 – Video</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #17120d;

            background: linear-gradient(
                -45deg,
                #ff4500,
                #ff7e00,
                #ffd000,
                #00c9ff,
                #7c3aed,
                #ff3cac
            );

            background-size: 500% 500%;
            animation: gradientMove 18s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255,255,255,0.45);
        }

        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0,0,0,.25);
        }

        .video-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="px-5 py-5">

        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">

            <a
                href="lektion1.html"
                class="glass rounded-2xl px-5 py-3 font-black text-lg
                       hover:scale-105 transition"
            >
                ← Lektion 1
            </a>

            <div class="glass rounded-full px-5 py-2 font-bold text-sm">
                🇩🇪 Deutschkurs
            </div>

        </div>

    </header>


    <!-- MAIN -->

    <main class="max-w-7xl mx-auto px-5 pb-16">

        <section class="text-center pt-8 pb-12">

            <div class="inline-block glass rounded-full px-5 py-2 mb-5
                        text-xs font-black uppercase tracking-widest">
                Lektion 1 – Seite 2
            </div>

            <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-5">
                Video – Aussprache
            </h1>

            <p class="text-lg md:text-xl font-semibold max-w-2xl mx-auto">
                Schaue dir das Video an und übe die deutsche Aussprache.
            </p>

        </section>


        <!-- VIDEO -->

        <section>

            <div class="video-container">

                <iframe
                    src="https://www.youtube.com/embed/wSmp39PZg9g"
                    title="Deutsches Alphabet Aussprache"
                    allow="
                        accelerometer;
                        autoplay;
                        clipboard-write;
                        encrypted-media;
                        gyroscope;
                        picture-in-picture;
                        web-share
                    "
                    allowfullscreen>
                </iframe>

            </div>

        </section>


        <!-- NAVIGATION -->

        <section class="flex justify-center gap-4 mt-14 flex-wrap">

            <a
                href="alphabet.html"
                class="bg-white text-black px-7 py-4 rounded-2xl
                       font-black hover:scale-105 transition shadow-xl"
            >
                ← Alphabet
            </a>

            <a
                href="reflektion.html"
                class="bg-black text-white px-7 py-4 rounded-2xl
                       font-black hover:scale-105 transition shadow-xl"
            >
                Reflektion →
            </a>

        </section>

    </main>

</body>
</html>
