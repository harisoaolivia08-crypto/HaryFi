<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HaryFi – Trennbare Verben (A1)</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #17120d;

            background: linear-gradient(
                -45deg,
                #ff4500,
                #ff7e00,
                #ffd000,
                #00c9ff,
                #7c3aed,
                #ff3cac
            );

            background-size: 500% 500%;
            animation: gradientMove 18s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            25% { background-position: 100% 50%; }
            50% { background-position: 100% 100%; }
            75% { background-position: 0% 100%; }
            100% { background-position: 0% 50%; }
        }

        .glass {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.45);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .page-button {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .page-button:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.08);
        }

        .page-button:active {
            transform: scale(0.97);
        }

        .page-view {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .page-view.active {
            display: block;
            opacity: 1;
        }

        input[type="text"] {
            transition: all 0.2s ease;
        }

        input[type="text"]:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.4);
        }

        .audio-btn {
            transition: transform 0.15s ease, background-color 0.15s ease;
            cursor: pointer;
        }
        .audio-btn:hover {
            transform: scale(1.1);
        }
        .audio-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

<!-- HEADER -->
<header class="px-5 py-5 sticky top-0 z-50 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
        <!-- LINK TO INDEX OR RETURN TO MAIN VIEW -->
        <a href="index.html#a1" id="nav-a1-link" class="glass rounded-2xl px-5 py-3 font-black text-lg hover:bg-white/40 transition">
            ← A1 Lektionen
        </a>

        <button id="nav-overview-btn" onclick="showOverview()" class="hidden glass rounded-2xl px-5 py-3 font-black text-lg hover:bg-white/40 transition">
            ← Zurück zur Übersicht
        </button>

        <div class="glass rounded-full px-5 py-2 font-bold text-sm flex items-center gap-2">
            <span>🇩🇪</span> Deutschkurs A1
        </div>
    </div>
</header>

<main class="max-w-6xl mx-auto px-5 pb-20">

    <!-- MAIN OVERVIEW (HUB) -->
    <div id="overview-view" class="page-view active">

        <!-- TITLE SECTION -->
        <section class="text-center pt-8 pb-12">
            <div class="inline-block glass rounded-full px-6 py-2 mb-4 text-xs font-black uppercase tracking-widest text-slate-900">
                Lektion · Trennbare Verben
            </div>

            <h1 class="text-5xl md:text-7xl font-black tracking-tight mb-5 text-slate-900 drop-shadow-sm text-center">
                Trennbare Verben
            </h1>

            <p class="text-lg md:text-xl font-semibold max-w-3xl mx-auto text-slate-800 mb-8">
                Lerne die Struktur, Konjugation, Satzstellung und praktische Übungen zu den trennbaren Verben im Deutschen.
            </p>

            <!-- BOUTON LEKTION STARTEN -->
            <div class="flex justify-center">
                <button onclick="showPage(1); speak('Willkommen zur Lektion Trennbare Verben!')" class="bg-purple-600 hover:bg-purple-700 text-white text-xl font-black px-10 py-5 rounded-3xl shadow-2xl hover:shadow-purple-500/50 transition transform hover:-translate-y-1">
                    <span class="text-2xl">🚀</span> Lektion Starten
                </button>
            </div>

            <!-- START BUTTON -->
            <div class="flex justify-center mt-5">
                <button onclick="showPage(1); speak('Willkommen zur Lektion Trennbare Verben!')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-lg font-black px-8 py-4 rounded-2xl shadow-xl hover:shadow-emerald-500/40 transition transform hover:-translate-y-1">
                    <span class="text-xl">▶️</span> Start
                </button>
            </div>
        </section>

        <!-- SEITEN GRID (6 CARDS) -->
        <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
