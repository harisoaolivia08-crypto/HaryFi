        .alphabet-content {
            max-width: 1200px;
            margin: auto;
            padding: 30px 20px 80px;
        }


        .alphabet-grid {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(130px, 1fr));

            gap: 20px;
            margin-top: 40px;
        }


        .letter-card {

            border: none;
            border-radius: 28px;

            min-height: 160px;

            cursor: pointer;

            color: white;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            box-shadow:
                0 15px 35px rgba(0,0,0,.20);

            transition:
                transform .2s ease,
                box-shadow .2s ease;

            position: relative;
            overflow: hidden;
        }


        .letter-card:hover {

            transform:
                translateY(-8px)
                scale(1.03);

            box-shadow:
                0 25px 45px rgba(0,0,0,.25);
        }


        .letter-card:active {

            transform:
                scale(.90);
        }


        .letter {

            font-size: 58px;
            font-weight: 900;

            line-height: 1;
        }
