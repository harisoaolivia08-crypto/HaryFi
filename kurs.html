<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HaryFi – Deutschkurs A2 bis B2</title><link rel="stylesheet" href="style.css"><style>
.k-wrap{position:relative;z-index:2;width:min(1100px,calc(100% - 28px));margin:24px auto 60px}.k-head,.k-card,.k-detail{background:#ffffffdb;border:1px solid #ffffffa6;border-radius:22px;box-shadow:0 12px 32px #54290014}.k-head{padding:24px;margin-bottom:20px}.k-head h1{font-size:clamp(1.8rem,5vw,3rem);margin:10px 0}.k-muted{color:#5c4835;line-height:1.6}.k-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.k-card{display:flex;align-items:center;gap:13px;padding:17px 14px;min-height:92px;text-align:left;color:#171717;cursor:pointer;font:inherit;transition:transform .2s,box-shadow .2s}.k-card:hover{transform:translateY(-3px);box-shadow:0 15px 30px #54290020}.k-num{display:grid;place-items:center;min-width:54px;height:54px;border-radius:17px;background:#171717;color:#ffc400;font-weight:900}.k-card strong{display:block;line-height:1.3}.k-card small{display:block;color:#6b5846;margin-top:5px;line-height:1.3}.k-detail{padding:clamp(18px,4vw,32px)}.k-detail h2{font-size:clamp(1.5rem,4vw,2.2rem);margin:10px 0}.k-columns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}.k-box{background:#fff5d8;border-radius:16px;padding:17px;line-height:1.65}.k-box h3{margin-bottom:8px}.k-btn{border:0;border-radius:12px;background:#171717;color:white;padding:12px 16px;font-weight:800;cursor:pointer;margin:8px 8px 0 0}.k-btn.gold{background:#ffc400;color:#171717}.k-vocab{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.k-vocab>div{background:#fff;border-radius:12px;padding:12px}.k-answer{display:block;width:100%;text-align:left;border:1px solid #e4d8c5;background:white;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.k-answer.good{background:#dff7e8;border-color:#16834a}.k-answer.bad{background:#ffe4e1;border-color:#c33}@media(max-width:760px){.k-list{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:470px){.k-list,.k-columns,.k-vocab{grid-template-columns:1fr}.k-card{min-height:78px}}
</style></head><body><canvas id="wordCanvas"></canvas><main class="k-wrap"><header class="k-head"><button class="back-button" onclick="location.href='index.html#levels'">← Zurück zu HaryFi</button><div class="header-logo">HARY<span>FI</span></div><p class="course-kicker">ND AO HIANATRA ALLEMAND</p><h1 id="levelTitle">Deutsch lernen</h1><p class="k-muted" id="levelIntro">Wähle ein Thema. Jede Lektion enthält Lernziele, Grammatik, Wortschatz und Übungen.</p></header><section id="lessonList" class="k-list"></section><section id="lessonDetail" hidden></section></main>
<script>
const COURSES={"A2":[["Alltag und Tagesablauf","Über Routinen sprechen; Zeitangaben und Häufigkeit","Präsens, trennbare Verben, Zeitadverbien"],["Wohnen und Nachbarschaft","Wohnung beschreiben und auf Anzeigen reagieren","Adjektive, Wechselpräpositionen, es gibt"],["Einkaufen und Dienstleistungen","Nachfragen, vergleichen und reklamieren","Komparativ, höfliche Fragen"],["Essen, Kochen und Ernährung","Rezepte verstehen und Vorlieben erklären","Imperativ, Mengenangaben"],["Gesundheit und Arztbesuch","Beschwerden beschreiben und Termine vereinbaren","Modalverben, müssen/sollen/dürfen"],["Arbeit und Beruf","Aufgaben und Arbeitszeiten beschreiben","Perfekt, Nebensätze mit weil"],["Schule und Sprachenlernen","Lernziele formulieren und über Erfahrungen sprechen","Infinitiv mit zu, deshalb"],["Freizeit, Sport und Medien","Interessen vergleichen und Vorschläge machen","gern/lieber/am liebsten, möchten"],["Einladungen und Feste","Einladen, zusagen und absagen","Dativpronomen, höfliche Formulierungen"],["Reisen und Urlaub","Reise planen und über Erlebnisse berichten","Perfekt mit haben und sein"],["Verkehr und Orientierung","Nach dem Weg fragen und Wege erklären","Präpositionen mit Dativ/Akkusativ"],["Wetter und Jahreszeiten","Wetter beschreiben und Aktivitäten planen","Adjektive, wenn-Sätze"],["Familie und Beziehungen","Menschen beschreiben und Kontakte pflegen","Possessivartikel, reflexive Verben"],["Kleidung und Aussehen","Kleidung auswählen und begründen","Adjektivdeklination nach bestimmtem Artikel (Einführung)"],["Vergangenheit und Erlebnisse","Erlebnisse erzählen und zeitlich ordnen","Perfekt, zuerst/dann/danach"],["Pläne und Verabredungen","Termine organisieren und verschieben","werden, möchten, Zeitangaben"],["Bitten, Ratschläge und Regeln","Hilfe anbieten und Empfehlungen geben","sollen, dürfen, Imperativ"],["Briefe, E-Mails und Nachrichten","Persönliche Nachrichten schreiben","Anrede, Grußformel, Satzverbindungen"],["Vergleichen und Begründen","Vor- und Nachteile einfach ausdrücken","Komparativ/Superlativ, weil/denn"],["A2-Wiederholung und Prüfung","Lesen, Hören, Schreiben und Sprechen trainieren","Wortschatz und Grammatik wiederholen"]],"B1":[["Biografie und Lebensstationen","Über den eigenen Lebensweg berichten","Präteritum wichtiger Verben, Zeitformen"],["Erfahrungen und Erlebnisse","Erlebnisse zusammenhängend erzählen","Perfekt und Präteritum, zeitliche Konnektoren"],["Freundschaft und Zusammenleben","Beziehungen und Konflikte beschreiben","Reflexive Verben, Relativsätze (Einführung)"],["Arbeitssuche und Bewerbung","Stellenanzeigen verstehen und sich bewerben","Passiv (Einführung), höfliche Formulierungen"],["Ausbildung und Berufswelt","Ausbildungswege und Arbeitsbedingungen vergleichen","Nebensätze, Konnektoren"],["Medien und digitale Welt","Mediennutzung diskutieren","indirekte Fragen, Meinung ausdrücken"],["Umwelt und Nachhaltigkeit","Probleme und Lösungsideen beschreiben","Passiv Präsens, man sollte"],["Gesundheit und Lebensstil","Gewohnheiten erklären und Ratschläge geben","Konjunktiv II für Vorschläge"],["Reisen, Kultur und Begegnungen","Kulturelle Erlebnisse schildern","Relativsätze, lokale Präpositionen"],["Wohnen und Stadtentwicklung","Wohnformen vergleichen und Probleme lösen","N-Deklination (Einführung), deshalb/trotzdem"],["Konsum und Werbung","Kaufentscheidungen begründen","Adjektivdeklination vertiefen"],["Bildung und lebenslanges Lernen","Lernmethoden bewerten","zu-Infinitiv, um…zu"],["Feste und gesellschaftliche Traditionen","Traditionen erklären und vergleichen","Passiv und temporale Nebensätze"],["Konflikte lösen und höflich reagieren","Kompromisse finden und Anliegen formulieren","Konjunktiv II, obwohl/trotzdem"],["Nachrichten und gesellschaftliche Themen","Ereignisse zusammenfassen","Passiv Präteritum, indirekte Rede (Einführung)"],["Meinung äußern und argumentieren","Standpunkte erklären und begründen","einerseits/andererseits, zwar/aber"],["Formelle und persönliche Korrespondenz","Beschwerden und Anfragen schreiben","Briefaufbau, Konnektoren"],["Diagramme und Informationen beschreiben","Zahlen und Entwicklungen erläutern","Vergleichssätze, Prozentangaben"],["Prüfungstraining: Sprechen und Schreiben","Präsentation und Diskussion strukturieren","Redemittel und Textaufbau"],["B1-Wiederholung und Prüfung","Alle Fertigkeiten gezielt trainieren","Grammatik und Wortschatz wiederholen"]],"B2":[["Komplexe Alltagssituationen","Differenziert berichten und reagieren","Nuancierte Konnektoren"],["Bildung und Berufsperspektiven","Systeme vergleichen und Entscheidungen begründen","Nominalisierung, komplexe Nebensätze"],["Arbeitswelt und Digitalisierung","Chancen und Risiken analysieren","Passivvarianten, Funktionsverbgefüge"],["Wissenschaft und Technik","Informationen zusammenfassen und einordnen","Partizipialattribute (Einführung)"],["Umweltpolitik und Nachhaltigkeit","Maßnahmen bewerten und abwägen","Konzessive und konsekutive Konnektoren"],["Gesundheit und Gesellschaft","Zusammenhänge differenziert erläutern","Modalverben in Vermutungen"],["Medien, Information und Manipulation","Quellen kritisch beurteilen","indirekte Rede, Konjunktiv I"],["Kultur, Kunst und Identität","Interpretationen begründen","Passiv, Nominalstil"],["Migration und interkulturelle Kommunikation","Perspektiven darstellen und vergleichen","Relativsätze, Partizipialkonstruktionen"],["Wirtschaft, Konsum und Globalisierung","Entwicklungen und Folgen erklären","Nominalisierung und Verbalstil"],["Politik und gesellschaftliche Teilhabe","Argumente strukturieren und abwägen","Konjunktiv II, komplexe Satzverbindungen"],["Konfliktmanagement und Verhandlung","Positionen vertreten und Lösungen verhandeln","Konzessivsätze, höfliche Distanz"],["Statistiken und Daten interpretieren","Diagramme präzise beschreiben","Vergleichsstrukturen und Redemittel"],["Vorträge und Präsentationen","Ein Thema klar und überzeugend präsentieren","Gliederungs- und Überleitungssprache"],["Erörterung und Stellungnahme","Eine differenzierte schriftliche Position entwickeln","Argumentationsaufbau, Konnektoren"],["Formelle Korrespondenz und Beschwerden","Sachlich und adressatengerecht schreiben","Nominalstil, Passiv"],["Zusammenfassen und paraphrasieren","Kernaussagen präzise wiedergeben","indirekte Rede, Synonyme"],["Hören und Lesen auf B2","Längere Texte und implizite Aussagen verstehen","Strategien und Wortschatzarbeit"],["Mündliche Diskussion und Debatte","Spontan reagieren und Gegenargumente behandeln","Redemittel für Zustimmung und Widerspruch"],["B2-Wiederholung und Prüfung","Alle Prüfungsteile systematisch vorbereiten","Prüfungsstrategien und Selbstkontrolle"]]};
const q=new URLSearchParams(location.search);const level=(q.get('niveau')||'A2').toUpperCase();const topics=COURSES[level]||COURSES.A2;
document.title='HaryFi – '+level+' Lektionen';document.getElementById('levelTitle').textContent=level+' – Lektionen';document.getElementById('levelIntro').textContent='Wähle ein Thema. Jede Lektion bietet ein Lernziel, Grammatik, Wortschatz, Dialog und Übung.';
const list=document.getElementById('lessonList'),detail=document.getElementById('lessonDetail');
topics.forEach((t,i)=>{const b=document.createElement('button');b.className='k-card';b.innerHTML='<span class="k-num">'+String(i+1).padStart(2,'0')+'</span><span><strong>'+t[0]+'</strong><small>'+t[1]+'</small></span>';b.addEventListener('click',()=>openLesson(i));list.appendChild(b)});
function openLesson(i){const t=topics[i];list.hidden=true;detail.hidden=false;const examples=examplesFor(level,i,t[0]);const words=wordsFor(level,i,t[0]);detail.innerHTML='<article class="k-detail"><button class="k-btn" id="backList">← Alle '+level+'-Themen</button><p class="course-kicker">'+level+' · LEKTION '+String(i+1).padStart(2,'0')+'</p><h2>'+t[0]+'</h2><p class="k-muted"><b>Lernziel:</b> '+t[1]+'.</p><div class="k-columns"><section class="k-box"><h3>📘 Grammatik</h3><p>'+t[2]+'.</p>'+examples.map(e=>'<p><b>'+e[0]+'</b><br>'+e[1]+'</p>').join('')+'</section><section class="k-box"><h3>🗣️ Wortschatz</h3><div class="k-vocab">'+words.map(w=>'<div><b>'+w[0]+'</b><br><small>'+w[1]+'</small><br><small>'+w[2]+'</small><br><button class="k-btn gold" onclick="speak('+JSON.stringify(w[0]).replace(/</g,'\\u003c')+')">🔊 Hören</button></div>').join('')+'</div><p class="k-muted">Deutsch · Malagasy · Français</p></section></div><section class="k-box" style="margin-top:14px"><h3>✍️ Übung</h3><p>'+quizFor(level,i,t[0])[0]+'</p>'+quizFor(level,i,t[0])[1].map((a,j)=>'<button class="k-answer" onclick="answer(this,'+(j===0)+')">'+a+'</button>').join('')+'<p id="feedback" aria-live="polite"></p></section><section class="k-box" style="margin-top:14px"><h3>🎭 Mini-Dialog</h3>'+examples.map(e=>'<p>'+e[0]+' — '+e[1]+'</p>').join('')+'<button class="k-btn" onclick="speak('+JSON.stringify(examples[0][0]).replace(/</g,'\\u003c')+')">🔊 Dialog anhören</button></section></article>';document.getElementById('backList').onclick=()=>{detail.hidden=true;list.hidden=false;window.scrollTo({top:0,behavior:'smooth'})};window.scrollTo({top:0,behavior:'smooth'})}
function examplesFor(l,i,title){if(l==='A2')return [['Hast du morgen Zeit?','Ja, gern. Um wie viel Uhr treffen wir uns?'],['Ich lerne Deutsch, weil ich in Deutschland lebe.','Ich möchte sicherer sprechen.']];if(l==='B1')return [['Meiner Meinung nach ist das wichtig.','Ich sehe das ähnlich, weil es viele Vorteile gibt.'],['Obwohl es schwierig war, habe ich viel gelernt.','Deshalb würde ich es wieder versuchen.']];return [['Einerseits bietet diese Lösung Vorteile.','Andererseits müssen mögliche Risiken berücksichtigt werden.'],['Ich vertrete die Auffassung, dass wir langfristig planen sollten.','Dennoch sollten wir die Gegenargumente ernst nehmen.']]}
function wordsFor(l,i,title){const base=l==='A2'?[['der Termin','fotoana voatondro','le rendez-vous'],['verschieben','manemotra','reporter'],['die Möglichkeit','fahafahana','la possibilité'],['weil','satria','parce que']]:l==='B1'?[['die Erfahrung','traikefa','l’expérience'],['die Meinung','hevitra','l’avis'],['begründen','manome antony','justifier'],['obwohl','na dia ... aza','bien que']]:[['die Voraussetzung','fepetra takiana','la condition préalable'],['abwägen','mandanjalanja','peser le pour et le contre'],['dennoch','na izany aza','néanmoins'],['die Auswirkung','vokany','la conséquence']];return base}
function quizFor(l,i,title){if(l==='A2')return ['Wähle den grammatisch richtigen Satz.',['Ich bleibe zu Hause, weil ich krank bin.','Ich bleibe zu Hause, weil bin ich krank.','Ich bleibe zu Hause, weil ich bin krank.']];if(l==='B1')return ['Wähle den passenden Satz.',['Obwohl ich müde war, habe ich weitergelernt.','Obwohl ich war müde, ich habe weitergelernt.','Obwohl müde war ich, habe weitergelernt.']];return ['Wähle den passenden Satz für eine differenzierte Argumentation.',['Einerseits ist es praktisch, andererseits entstehen neue Risiken.','Einerseits es praktisch ist, andererseits entstehen Risiken neue.','Andererseits praktisch ist einerseits es.']]}
function answer(el,ok){document.querySelectorAll('.k-answer').forEach(b=>b.classList.remove('good','bad'));el.classList.add(ok?'good':'bad');document.getElementById('feedback').textContent=ok?'Richtig! Sehr gut! 🎉':'Noch nicht richtig. Lies die Beispiele und versuche es erneut.'}
function speak(text){if(!('speechSynthesis'in window)){alert('Sprachausgabe wird nicht unterstützt.');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='de-DE';u.rate=.88;const v=speechSynthesis.getVoices().filter(x=>x.lang.toLowerCase().startsWith('de'));u.voice=v.find(x=>/female|katja|petra|helena|anna|vicki/i.test(x.name))||v[0]||null;speechSynthesis.speak(u)}
</script></body></html>
