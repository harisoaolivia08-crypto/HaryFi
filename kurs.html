A2:[
{goal:"Nach dieser Lektion kannst du deinen Bildungsweg vorstellen, Berufe beschreiben, einen typischen Arbeitstag erzählen und einen kurzen Lebenslauf verstehen.",grammar:"Im Präsens steht das konjugierte Verb normalerweise auf Position 2: „Ich mache eine Ausbildung.“ Bei trennbaren Verben steht die Vorsilbe am Satzende: „Ich stehe um sechs Uhr auf.“ Im Perfekt verwendet man haben oder sein + Partizip II: „Ich habe gelernt“, aber „Ich bin zur Schule gegangen.“ Reflexive Verben stehen mit einem Reflexivpronomen: „Ich interessiere mich für Pflege.“",examples:[["Präsens","Ich mache eine Ausbildung zur Pflegefachfrau."],["Trennbares Verb","Mein Unterricht fängt um acht Uhr an."],["Perfekt","Letztes Jahr habe ich ein Praktikum gemacht."],["Reflexiv","Ich bereite mich auf die Prüfung vor."]],words:[["die Ausbildung","fiofanana","la formation"],["der Lebenslauf","tantaram-piainana","le CV"],["die Tätigkeit","asa atao","l’activité"],["sich bewerben","mangataka asa","postuler"],["der Tagesablauf","fandehan’ny andro","le déroulement de la journée"],["die Erfahrung","traikefa","l’expérience"]],dialog:[["Mira","Was machst du beruflich?"],["Lina","Ich mache eine Ausbildung zur Pflegefachfrau."],["Mira","Wie sieht dein Tagesablauf aus?"],["Lina","Ich stehe früh auf und fahre mit dem Bus zur Schule." ]],reading:"Lina ist 24 Jahre alt und macht eine Ausbildung. An Schultagen steht sie um sechs Uhr auf. Zuerst frühstückt sie, danach fährt sie mit dem Bus. Im Unterricht lernt sie Fachbegriffe und übt Gespräche. Am Abend wiederholt sie ihre Notizen, weil sie die Prüfung bestehen möchte.",writing:"Schreibe einen kurzen Lebenslauftext mit 8–10 Sätzen: Name, Herkunft, Schule/Ausbildung, Praktika, Fähigkeiten, Tagesablauf und berufliches Ziel.",speaking:"Stelle dich in 60–90 Sekunden vor. Erzähle, was du gelernt hast, welche Tätigkeiten du gern machst und warum du diesen Beruf gewählt hast.",quiz:["Mein Unterricht ___ um acht Uhr ___.",["fängt … an","an … fängt","fangen … an"],0]},
{goal:"Du kannst über Freizeitinteressen sprechen, eine kurze Biografie verstehen, Vorlieben ausdrücken und eine Verabredung vereinbaren.",grammar:"Modalverben stehen konjugiert auf Position 2; der Infinitiv steht am Satzende: „Ich kann gut fotografieren.“ Für Vorlieben nutzt man gern/lieber/am liebsten. Nicht verneint meist Verben oder Satzteile: „Ich gehe heute nicht ins Kino.“ Kein verneint Nomen ohne bestimmten Artikel: „Ich habe keine Zeit.“ Das Präteritum von sein und haben ist war/hatte.",examples:[["Modalverb","Wir möchten am Samstag ins Kino gehen."],["Vorliebe","Am liebsten höre ich Musik."],["Präteritum","Als Kind hatte ich viele Hobbys."],["Negation","Ich kann heute leider nicht kommen."]],words:[["das Hobby","fialam-boly","le loisir"],["die Freizeit","fotoana malalaka","le temps libre"],["die Verabredung","fotoana nifanarahana","le rendez-vous"],["fotografieren","maka sary","photographier"],["die Ausstellung","fampirantiana","l’exposition"],["absagen","manafoana","annuler"]],dialog:[["Nora","Hast du am Samstag Zeit?"],["Mina","Ja, gern. Was möchtest du machen?"],["Nora","Wollen wir ins Kino gehen?"],["Mina","Gute Idee! Um wie viel Uhr treffen wir uns?"]],reading:"Am Wochenende besucht Mina gern Museen und fotografiert die Stadt. Früher spielte sie Klavier, heute hört sie lieber Musik und trifft Freunde. Für Samstag verabredet sie sich mit Nora. Sie schreiben die Uhrzeit und den Treffpunkt in den Chat.",writing:"Schreibe eine Nachricht an eine Freundin oder einen Freund: Schlage eine Aktivität vor, nenne Tag, Uhrzeit und Treffpunkt und bitte um eine Antwort. Schreibe auch eine höfliche Absage.",speaking:"Erzähle von drei Hobbys. Begründe, was du am liebsten machst, und verabrede dich mit deiner Lernpartnerin oder deinem Lernpartner.",quiz:["Welcher Satz ist richtig?",["Ich kann gut fotografieren.","Ich kann fotografieren gut kann.","Ich gut kann fotografieren."],0]},
{goal:"Du kannst Preise vergleichen, monatliche Ausgaben nennen, einen einfachen Kauf planen und höflich nach Geld- oder Zahlungsinformationen fragen.",grammar:"Ein weil-Satz nennt einen Grund; das konjugierte Verb steht am Ende: „Ich kaufe das nicht, weil es zu teuer ist.“ Wenn beschreibt eine Bedingung oder Wiederholung: „Wenn ich spare, kann ich reisen.“ Bei vielen Verben steht die Person im Dativ und die Sache im Akkusativ: „Ich gebe meiner Schwester das Geld.“ Mit Konjunktiv II klingt eine Bitte höflicher: „Könnten Sie mir helfen?“",examples:[["weil","Ich kaufe das Fahrrad, weil ich es brauche."],["wenn","Wenn ich genug Geld habe, fahre ich in Urlaub."],["Dativ + Akkusativ","Der Verkäufer zeigt mir das Gerät."],["Höfliche Bitte","Könnten Sie mir bitte den Preis nennen?"]],words:[["die Ausgabe","fandaniana","la dépense"],["der Preis","vidiny","le prix"],["sparen","mitahiry vola","économiser"],["das Konto","kaonty","le compte"],["die Rechnung","faktiora","la facture"],["sich leisten","mahatakatra ny vidiny","pouvoir se permettre"]],dialog:[["Kundin","Wie viel kostet diese Tasche?"],["Verkäufer","Sie kostet 35 Euro."],["Kundin","Gibt es auch ein günstigeres Modell?"],["Verkäufer","Ja, dieses Modell kostet nur 25 Euro."]],reading:"Paul notiert jeden Monat seine Einnahmen und Ausgaben. Er bezahlt zuerst die Miete und die Fahrkarte. Danach plant er sein Essen und legt einen kleinen Betrag zurück. Wenn ein Gerät teuer ist, vergleicht er mehrere Angebote, bevor er kauft.",writing:"Erstelle einen einfachen Monatsplan mit mindestens fünf Ausgaben. Schreibe anschließend 6–8 Sätze darüber, wo du sparen könntest und warum.",speaking:"Spielt einen Dialog im Geschäft. Frage nach Preis, Qualität und Zahlungsmöglichkeiten und entscheide, welches Produkt du kaufst.",quiz:["Welche Wortstellung ist richtig?",["Ich spare, weil ich ein Fahrrad kaufen möchte.","Ich spare, weil ich möchte kaufen ein Fahrrad.","Ich spare, weil möchte ich ein Fahrrad kaufen."],0]},
{goal:"Du kannst berufliche Telefonate führen, Termine vereinbaren und verschieben, höfliche Bitten äußern sowie eine passende E-Mail schreiben.",grammar:"Zeitangaben stehen häufig mit am (am Montag), um (um 10 Uhr), im (im Juni) und von … bis (von neun bis zwölf). Verben mit Präpositionen lernt man zusammen: warten auf + Akkusativ, sprechen mit + Dativ, sich interessieren für + Akkusativ. Indirekte Fragen sind höflicher: „Können Sie mir sagen, wann der Termin beginnt?“ In dass-Sätzen steht das Verb am Ende: „Ich hoffe, dass Sie Zeit haben.“",examples:[["Temporale Angabe","Der Termin ist am Donnerstag um 14 Uhr."],["Verb mit Präposition","Ich warte auf Ihre Rückmeldung."],["Indirekte Frage","Könnten Sie mir sagen, wann Sie erreichbar sind?"],["dass-Satz","Ich hoffe, dass der Termin noch frei ist."]],words:[["der Termin","fotoana voatondro","le rendez-vous"],["die Rückmeldung","valiny","le retour / la réponse"],["verschieben","manemotra","reporter"],["erreichbar","azo antsoina","joignable"],["die Durchwahl","laharana anatiny","le numéro direct"],["die Anfrage","fangatahana","la demande"]],dialog:[["Sekretärin","Guten Tag, Praxis Müller. Wie kann ich Ihnen helfen?"],["Anrufer","Guten Tag. Ich möchte gern einen Termin vereinbaren."],["Sekretärin","Passt Ihnen Donnerstag um zehn Uhr?"],["Anrufer","Ja, vielen Dank. Könnten Sie mir die Uhrzeit bitte bestätigen?"]],reading:"Sehr geehrte Frau Becker, leider kann ich den vereinbarten Termin am Dienstag nicht wahrnehmen. Wäre es möglich, den Termin auf Donnerstagvormittag zu verschieben? Ich freue mich auf Ihre Rückmeldung. Mit freundlichen Grüßen, Sara Rakoto.",writing:"Schreibe eine formelle E-Mail: Erkläre, warum du einen Termin nicht wahrnehmen kannst, schlage zwei Alternativen vor und bitte um Bestätigung.",speaking:"Führe ein berufliches Telefonat. Begrüße die Person, nenne dein Anliegen, kläre Datum und Uhrzeit und beende das Gespräch höflich.",quiz:["Welche indirekte Frage ist richtig?",["Können Sie mir sagen, wann der Termin beginnt?","Können Sie mir sagen, wann beginnt der Termin?","Können Sie mir sagen, wann der Termin beginnen?"],0]},
{goal:"Du kannst eine Reise planen, Reiseziele vergleichen, über Wetter sprechen und Verkehrsmittel sowie Länder und Nationalitäten beschreiben.",grammar:"Lokale Präpositionen zeigen Richtung oder Ort: nach Berlin, in die Schweiz, aus Frankreich, bei Freunden. Bei Wechselpräpositionen steht bei einer Ortsangabe häufig der Dativ (im Hotel), bei einer Richtung der Akkusativ (ins Hotel). Adjektive vor Nomen bekommen eine Endung: ein schöner Ort, der schöne Strand. Obwohl leitet einen Gegensatz ein und verlangt das Verb am Ende: „Obwohl es regnet, gehen wir spazieren.“",examples:[["Reiseziel","Wir fahren nächste Woche nach Österreich."],["Ort/Richtung","Wir sind im Hotel und gehen später in das Museum."],["Adjektiv","Wir haben ein günstiges Hotel gefunden."],["obwohl","Obwohl es kalt ist, machen wir eine Stadtführung."]],words:[["das Reiseziel","toerana haleha","la destination"],["die Unterkunft","toeram-ponenana","l’hébergement"],["die Sehenswürdigkeit","toerana mendrika hojerena","le site touristique"],["die Fahrkarte","tapakila","le billet"],["die Verspätung","fahatarana","le retard"],["die Stadtführung","fitsidihana tanàna miaraka amin’ny mpitari-dalana","la visite guidée"]],dialog:[["Reisende","Entschuldigung, fährt dieser Zug nach Heidelberg?"],["Mitarbeiter","Ja, aber heute hat er zehn Minuten Verspätung."],["Reisende","Muss ich umsteigen?"],["Mitarbeiter","Nein, Sie können direkt bis Heidelberg fahren."]],reading:"Für den Kurzurlaub vergleicht Sara zwei Städte. Sie prüft die Zugverbindungen, die Preise und die Wettervorhersage. Obwohl die Unterkunft in der Altstadt etwas teurer ist, bucht sie sie, weil viele Sehenswürdigkeiten zu Fuß erreichbar sind.",writing:"Schreibe einen Reiseplan für zwei Tage. Nenne Ziel, Verkehrsmittel, Unterkunft, Wetterplan und mindestens drei Aktivitäten. Begründe eine Entscheidung mit obwohl.",speaking:"Empfiehl einer Besucherin eine Stadt. Beschreibe Sehenswürdigkeiten, Verkehrsmittel und eine mögliche Schwierigkeit.",quiz:["Welche Verbindung ist korrekt?",["Obwohl es regnet, machen wir einen Ausflug.","Obwohl es regnet, wir machen einen Ausflug.","Obwohl regnet es, machen wir einen Ausflug."],0]},
{goal:"Du kannst Menschen und Haustiere beschreiben, Charaktereigenschaften nennen, Personen vergleichen und freundlich Lob oder Kritik äußern.",grammar:"Der Komparativ wird häufig mit -er gebildet: freundlich – freundlicher. Der Superlativ lautet oft am … -sten: „Sie ist am freundlichsten.“ Einige Formen sind unregelmäßig: gut – besser – am besten. Relativsätze geben Zusatzinformationen; das Verb steht am Ende: „Das ist der Mann, der nebenan wohnt.“ Für Ratschläge verwendet man sollten: „Du solltest offen mit ihr sprechen.“",examples:[["Komparativ","Meine Schwester ist geduldiger als ich."],["Superlativ","Unser Hund ist am ruhigsten."],["Relativsatz","Das ist die Freundin, die mir immer hilft."],["Ratschlag","Du solltest ihn direkt fragen."]],words:[["das Aussehen","endrika ivelany","l’apparence"],["die Eigenschaft","toetra","la qualité / le trait"],["geduldig","manam-paharetana","patient"],["zuverlässig","azo itokisana","fiable"],["die Beziehung","fifandraisana","la relation"],["kritisieren","mitsikera","critiquer"]],dialog:[["Mila","Wie ist deine neue Kollegin?"],["Tiana","Sie ist sehr freundlich und zuverlässig."],["Mila","Was schätzt du besonders an ihr?"],["Tiana","Sie hört gut zu und hilft, wenn jemand Fragen hat."]],reading:"Jonas hat einen älteren Hund, der sehr ruhig ist. Seine Nachbarin hat eine junge Katze, die viel aktiver ist. Beide kümmern sich gut um ihre Tiere. Wenn sie ein Problem haben, sprechen sie freundlich miteinander, statt sofort Kritik zu üben.",writing:"Beschreibe eine Person, die du gut kennst. Schreibe über Aussehen, Charakter, Stärken und eine Eigenschaft, die du an dieser Person schätzt. Verwende einen Relativsatz und zwei Vergleiche.",speaking:"Beschreibe eine Person oder ein Haustier, ohne den Namen zu nennen. Die andere Person soll erraten, wen oder was du meinst.",quiz:["Welcher Satz ist richtig?",["Das ist die Frau, die neben mir wohnt.","Das ist die Frau, die wohnt neben mir.","Das ist die Frau, neben mir wohnt die."],0]},
{goal:"Du kannst deine Wohnung beschreiben, Möbel und Wohnformen vergleichen, einfache Rezepte verstehen und im Restaurant bestellen.",grammar:"Bei Wechselpräpositionen fragt man Wo? + Dativ („Das Buch liegt auf dem Tisch.“) oder Wohin? + Akkusativ („Ich lege das Buch auf den Tisch.“). Deshalb leitet eine Folge ein; trotzdem zeigt einen Gegensatz: „Es regnet, trotzdem gehen wir hinaus.“ Als beschreibt einen einmaligen Zeitpunkt in der Vergangenheit; wenn beschreibt Bedingungen oder wiederholte Situationen. Bei Infinitiv mit zu: „Ich habe vor, heute zu kochen.“",examples:[["Wechselpräposition","Die Lampe steht neben dem Sofa."],["Richtung","Ich stelle die Lampe neben das Sofa."],["deshalb/trotzdem","Ich bin müde, trotzdem koche ich etwas Gesundes."],["Infinitiv mit zu","Ich habe vergessen, Brot zu kaufen."]],words:[["die Wohnung","trano fonenana","l’appartement"],["das Möbelstück","fanaka","le meuble"],["die Miete","hofan-trano","le loyer"],["die Zutat","akora ilaina","l’ingrédient"],["die Speisekarte","lisitry ny sakafo","le menu"],["die Beilage","sakafo miaraka","l’accompagnement"]],dialog:[["Gast","Guten Abend. Was können Sie empfehlen?"],["Servicekraft","Unsere Gemüsesuppe ist heute frisch zubereitet."],["Gast","Dann nehme ich die Suppe und ein Wasser, bitte."],["Servicekraft","Sehr gern. Möchten Sie noch etwas dazu?" ]],reading:"In Saras Wohnung ist die Küche klein, aber praktisch. Die Töpfe stehen im Schrank und die Gewürze liegen neben dem Herd. Am Wochenende probiert sie ein neues Rezept. Sie liest zuerst die Zutatenliste und bereitet alles vor, bevor sie mit dem Kochen beginnt.",writing:"Beschreibe deine Wunschwohnung und schreibe ein einfaches Rezept mit Zutaten und nummerierten Arbeitsschritten. Nutze Wechselpräpositionen und mindestens einen Satz mit deshalb oder trotzdem.",speaking:"Spielt einen Restaurantbesuch. Bestelle Essen und Getränke, frage nach Zutaten und äußere höflich einen Sonderwunsch.",quiz:["Wo steht der Tisch? — Er steht ___ Fenster.",["am","ans","an den"],0]},
{goal:"Du kannst kurze Nachrichten zu Politik, Technik, Kultur und Umwelt verstehen, Erfindungen beschreiben und einfache Probleme oder Maßnahmen erklären.",grammar:"Im Passiv steht die Handlung im Mittelpunkt: werden + Partizip II. Aktiv: „Die Firma entwickelt ein Gerät.“ Passiv: „Ein Gerät wird entwickelt.“ Um … zu drückt ein Ziel aus, wenn das Subjekt gleich bleibt: „Ich lerne, um die Prüfung zu bestehen.“ Nach vielen Dativpräpositionen steht der Dativ, zum Beispiel mit, bei, nach, seit, von und zu.",examples:[["Passiv","Neue Geräte werden jedes Jahr entwickelt."],["Ziel","Viele Menschen nutzen Apps, um Zeit zu sparen."],["Dativpräposition","Mit dem neuen Gerät kann man Energie sparen."],["Meinung","Meiner Meinung nach sollte die Stadt mehr Bäume pflanzen."]],words:[["die Erfindung","famoronana zava-baovao","l’invention"],["die Nachricht","vaovao","la nouvelle"],["die Umwelt","tontolo iainana","l’environnement"],["die Entwicklung","fivoarana","le développement"],["der Vorteil","tombony","l’avantage"],["die Maßnahme","fepetra","la mesure"]],dialog:[["A","Hast du die Nachrichten über die neue Erfindung gelesen?"],["B","Ja. Das Gerät wird mit Solarenergie betrieben."],["A","Das klingt nützlich. Wofür kann man es verwenden?"],["B","Zum Beispiel, um Strom zu sparen."]],reading:"In vielen Städten werden neue Fahrradwege gebaut. Die Maßnahmen sollen die Luftqualität verbessern und Menschen dazu motivieren, kurze Wege ohne Auto zurückzulegen. Gleichzeitig diskutieren Bürgerinnen und Bürger über Kosten und die Frage, wo neue Wege sinnvoll sind.",writing:"Schreibe einen kurzen Informationstext über eine technische Erfindung oder ein Umweltproblem. Erkläre, wie es funktioniert beziehungsweise worin das Problem besteht, und nenne zwei Vorteile oder Lösungsmöglichkeiten.",speaking:"Wähle eine Erfindung oder Umweltmaßnahme. Erkläre ihre Funktion, einen Vorteil, einen möglichen Nachteil und deine Meinung.",quiz:["Welche Passivform ist korrekt?",["Neue Geräte werden entwickelt.","Neue Geräte werden entwickeln.","Neue Geräte ist entwickelt."],0]}

{goal:"Du kannst über Zeitmanagement und Freizeit sprechen, kulturelle Angebote beschreiben und Erlebnisse geordnet erzählen.",grammar:"Erzählungen verbinden Perfekt und Präteritum: Das Perfekt ist in Gesprächen häufig („Ich habe ein Museum besucht“); sein, haben und Modalverben stehen oft im Präteritum („Es war interessant“, „Ich musste warten“). Temporale Konnektoren ordnen Ereignisse: zuerst, anschließend, während, nachdem, bevor und schließlich.",examples:[["Reihenfolge","Zuerst habe ich die Ausstellung besucht, anschließend bin ich spazieren gegangen."],["Präteritum","Das Museum war sehr interessant."],["Gleichzeitigkeit","Während ich wartete, las ich die Informationen."],["Meinung","Meiner Ansicht nach lohnt sich der Besuch."]],words:[["die Pünktlichkeit","fahamarinana ara-potoana","la ponctualité"],["die Freizeitgestaltung","fomba fandaminana fotoana malalaka","l’organisation des loisirs"],["die Ausstellung","fampirantiana","l’exposition"],["sich entspannen","miala sasatra","se détendre"],["die Veranstaltung","hetsika / lanonana","l’événement"],["die Verspätung","fahatarana","le retard"]],dialog:[["Lea","Was hast du am Wochenende gemacht?"],["Noah","Zuerst war ich im Museum, danach habe ich Freunde getroffen."],["Lea","Hat dir die Ausstellung gefallen?"],["Noah","Ja, besonders die modernen Bilder fand ich spannend."]],reading:"Viele Menschen planen ihre Woche sehr genau, während andere lieber spontan entscheiden. Beides kann funktionieren. Wer feste Zeiten für Arbeit und Erholung einplant, hat oft weniger Stress. Wichtig ist, genug Zeit für Schlaf, Bewegung und soziale Kontakte zu lassen.",writing:"Schreibe über einen gelungenen oder stressigen Tag. Ordne mindestens sechs Ereignisse zeitlich und bewerte am Ende, was du beim nächsten Mal anders machen würdest.",speaking:"Berichte zwei Minuten über einen freien Tag. Verwende zuerst, danach, während, schließlich und eine persönliche Bewertung.",quiz:["Welche Satzverbindung ist richtig?",["Während ich auf den Bus wartete, hörte ich Musik.","Während ich wartete auf den Bus, hörte ich Musik.","Während wartete ich auf den Bus, hörte Musik."],0]},
{goal:"Du kannst über Arbeitsbedingungen sprechen, beruflichen Stress beschreiben, Ratschläge geben und ein Problem sachlich erklären.",grammar:"Mit Konjunktiv II formuliert man höfliche Bitten und Vorschläge: „Könnten Sie mir helfen?“ / „Du könntest eine Pause machen.“ Obwohl leitet einen Gegensatz ein und das Verb steht am Ende. Relativsätze präzisieren Nomen: „Die Kollegin, die mich eingearbeitet hat, war sehr geduldig.“ In formellen Situationen helfen klare, höfliche Redemittel.",examples:[["Ratschlag","An deiner Stelle würde ich mit der Leitung sprechen."],["obwohl","Obwohl die Arbeit anstrengend ist, macht sie mir Freude."],["Relativsatz","Der Kollege, der den Dienstplan erstellt, ist heute da."],["Höflichkeit","Könnten wir einen Gesprächstermin vereinbaren?"]],words:[["die Arbeitsbedingung","fepetra iasana","la condition de travail"],["die Belastung","enta-mavesatra","la charge"],["die Schicht","fotoam-piasana","le poste / l’équipe"],["die Rückmeldung","valiny","le retour"],["die Lösung","vahaolana","la solution"],["einen Vorschlag machen","manolotra hevitra","faire une proposition"]],dialog:[["Mitarbeiterin","In letzter Zeit ist die Arbeitsbelastung sehr hoch."],["Kollege","Das klingt schwierig. Hast du schon mit der Leitung gesprochen?"],["Mitarbeiterin","Noch nicht. Könntest du mir helfen, einen Termin zu vereinbaren?"],["Kollege","Natürlich. An deiner Stelle würde ich die konkreten Beispiele notieren."]],reading:"In einem Team gab es immer häufiger Missverständnisse bei der Dienstplanung. Statt sich gegenseitig Vorwürfe zu machen, sammelten die Mitarbeitenden konkrete Beispiele und vereinbarten ein Gespräch. Danach wurden Zuständigkeiten klarer verteilt und Änderungen rechtzeitig mitgeteilt.",writing:"Schreibe eine sachliche E-Mail an eine vorgesetzte Person. Beschreibe ein Problem am Arbeitsplatz, erkläre seine Folgen und mache zwei höfliche Lösungsvorschläge.",speaking:"Beschreibe eine schwierige Situation im Team. Bitte um Rat, gib selbst einen Rat und reagiere höflich auf einen Gegenvorschlag.",quiz:["Welche Formulierung ist höflich?",["Könnten wir einen Gesprächstermin vereinbaren?","Wir müssen jetzt sofort reden!","Gib mir einen Termin."],0]},
{goal:"Du kannst Medienangebote vergleichen, Nachrichten kritisch betrachten und Informationen aus mehreren Quellen zusammenfassen.",grammar:"Indirekte Fragen beginnen mit ob oder einem Fragewort; das Verb steht am Ende: „Ich weiß nicht, ob die Meldung stimmt.“ Das Passiv hebt die Handlung hervor: „Die Nachricht wurde veröffentlicht.“ Dass-Sätze geben Gedanken und Aussagen wieder: „Ich finde, dass man Quellen prüfen sollte.“ Für einen Gegensatz nutzt man hingegen, dagegen oder während.",examples:[["Indirekte Frage","Kannst du mir sagen, woher diese Information stammt?"],["Passiv","Die Meldung wurde gestern veröffentlicht."],["dass-Satz","Ich glaube, dass nicht jede Überschrift zuverlässig ist."],["Gegensatz","Online-Nachrichten sind schnell; gedruckte Zeitungen bieten dagegen oft mehr Hintergrund."]],words:[["die Quelle","loharano","la source"],["die Schlagzeile","lohateny","le titre"],["die Meldung","fampitam-baovao","la dépêche"],["zuverlässig","azo itokisana","fiable"],["überprüfen","manamarina","vérifier"],["die Fehlinformation","vaovao diso","la fausse information"]],dialog:[["A","Hast du diese Nachricht schon überprüft?"],["B","Noch nicht. Ich möchte zuerst die Quelle finden."],["A","Gute Idee. Die Überschrift klingt sehr dramatisch."],["B","Ja, deshalb lese ich den ganzen Artikel und vergleiche andere Medien."]],reading:"Eine Nachricht verbreitete sich online innerhalb weniger Minuten. Später stellte sich heraus, dass ein wichtiges Detail falsch dargestellt worden war. Fachleute empfehlen deshalb, Datum, Urheber und Originalquelle zu prüfen und eine Meldung mit mehreren seriösen Quellen zu vergleichen.",writing:"Fasse eine aktuelle Nachricht in 120–150 Wörtern zusammen. Nenne Quelle und Kernaussage, unterscheide Fakten von Meinungen und erkläre, warum du die Quelle für glaubwürdig hältst oder nicht.",speaking:"Vergleiche zwei Medien, die du kennst. Diskutiere Schnelligkeit, Zuverlässigkeit, Kosten und Datenschutz.",quiz:["Welche indirekte Frage ist richtig?",["Ich weiß nicht, ob die Meldung stimmt.","Ich weiß nicht, ob stimmt die Meldung.","Ich weiß nicht, ob die Meldung stimmt sie."],0]},
{goal:"Du kannst Werbung analysieren, Konsumtrends beschreiben und Kaufentscheidungen mit mehreren Argumenten begründen.",grammar:"Je … desto verbindet zwei Entwicklungen: „Je länger die Garantie ist, desto sicherer fühle ich mich.“ Zwar … aber stellt einen Gegensatz dar: „Das Gerät ist zwar teuer, aber langlebig.“ Mit dem Komparativ vergleicht man Eigenschaften. Für eine ausgewogene Argumentation nennt man Vorteile und Nachteile und begründet anschließend die eigene Entscheidung.",examples:[["je … desto","Je besser die Qualität ist, desto länger hält das Produkt."],["zwar … aber","Die Werbung ist zwar kreativ, aber nicht immer informativ."],["Vergleich","Dieses Modell ist günstiger als das andere."],["Abwägung","Einerseits spart man Zeit, andererseits entsteht Verpackungsmüll."]],words:[["die Zielgruppe","vondron’olona kendrena","le public cible"],["die Kaufentscheidung","fanapahan-kevitra hividy","la décision d’achat"],["die Verpackung","fonosana","l’emballage"],["langlebig","maharitra","durable"],["das Sonderangebot","tolotra manokana","la promotion"],["der Verbrauch","fandaniana","la consommation"]],dialog:[["A","Warum möchtest du dieses Handy kaufen?"],["B","Es ist zwar teurer, aber die Kamera ist deutlich besser."],["A","Hast du auch die Garantie verglichen?"],["B","Ja. Je länger die Garantie ist, desto besser fühle ich mich beim Kauf."]],reading:"Werbung nutzt Bilder, Gefühle und kurze Botschaften, um Produkte attraktiv erscheinen zu lassen. Verbraucherinnen und Verbraucher sollten deshalb nicht nur auf den Preis achten, sondern auch Qualität, Reparierbarkeit, Garantie und Umweltfolgen berücksichtigen.",writing:"Schreibe eine begründete Kaufentscheidung zu einem Produkt. Vergleiche zwei Angebote, nenne mindestens zwei Vorteile und einen Nachteil und verwende je … desto sowie zwar … aber.",speaking:"Diskutiere, ob Werbung beim Einkaufen hilft oder zum unnötigen Konsum verleitet. Reagiere auf ein Gegenargument.",quiz:["Welche Konstruktion ist korrekt?",["Je länger ich spare, desto teurer kann das Produkt sein.","Je länger ich spare, desto das Produkt kann teurer sein.","Je ich länger spare, desto teurer kann sein das Produkt."],0]},
{goal:"Du kannst deine Lernbiografie erzählen, Lernmethoden vergleichen und erklären, wie du ein persönliches Lernziel erreichen möchtest.",grammar:"Um … zu drückt ein Ziel aus, wenn beide Satzteile dasselbe Subjekt haben: „Ich wiederhole Wörter, um sie besser zu behalten.“ Damit verwendet man bei unterschiedlichen Subjekten: „Die Lehrerin erklärt die Regel, damit alle sie verstehen.“ Nach Verben wie versuchen, planen oder vergessen folgt häufig zu + Infinitiv. Relativsätze geben zusätzliche Informationen.",examples:[["um … zu","Ich höre Podcasts, um mein Hörverstehen zu verbessern."],["damit","Ich spreche langsam, damit meine Partnerin mich versteht."],["zu-Infinitiv","Ich habe vor, jeden Tag zehn Wörter zu lernen."],["Relativsatz","Die Methode, die mir hilft, ist das Lernen mit Karteikarten."]],words:[["die Lernstrategie","paikady fianarana","la stratégie d’apprentissage"],["der Fortschritt","fandrosoana","le progrès"],["die Fähigkeit","fahaiza-manao","la compétence"],["sich merken","mahatsiaro","retenir"],["die Rückmeldung","valiny","le retour"],["das Lernziel","tanjona fianarana","l’objectif d’apprentissage"]],dialog:[["A","Wie lernst du neue Wörter?"],["B","Ich schreibe Beispielsätze, um sie im Kontext zu behalten."],["A","Übst du auch das Sprechen?"],["B","Ja, ich telefoniere mit einer Lernpartnerin, damit ich flüssiger werde."]],reading:"Erfolgreiches Lernen hängt nicht nur von der Zeit ab, sondern auch von der Methode. Wer Inhalte in Abständen wiederholt, sie aktiv abruft und in eigenen Sätzen verwendet, erinnert sich häufig länger daran. Regelmäßiges Feedback hilft, Fehler zu erkennen und realistische Ziele zu setzen.",writing:"Schreibe einen Lernplan für vier Wochen. Nenne dein Ziel, tägliche Aktivitäten, Wiederholungszeiten und eine Methode, mit der du deinen Fortschritt überprüfst.",speaking:"Berichte über eine Lernerfahrung. Erkläre, was gut funktioniert hat, was schwierig war und welchen Tipp du anderen geben würdest.",quiz:["Welche Aussage über den Zweck ist richtig?",["Ich übe täglich, um sicherer zu sprechen.","Ich übe täglich, um ich spreche sicherer.","Ich übe täglich, damit sicherer zu sprechen."],0]},
{goal:"Du kannst Mobilitätsprobleme beschreiben, Verkehrsmittel abwägen, eine Beschwerde formulieren und nachhaltige Alternativen diskutieren.",grammar:"Das Passiv bildet man mit werden + Partizip II: „Die Straße wird repariert.“ Obwohl leitet einen Gegensatz ein; trotzdem steht meist im Hauptsatz: „Obwohl der Bus spät kam, erreichte ich den Termin. Der Bus kam spät, trotzdem erreichte ich den Termin.“ Mit Konjunktiv II formuliert man Vorschläge: „Man könnte mehr Busse einsetzen.“",examples:[["Passiv","Die Haltestelle wird gerade umgebaut."],["obwohl","Obwohl ich früh losgefahren bin, hatte der Zug Verspätung."],["trotzdem","Die Fahrt war lang. Trotzdem war sie bequem."],["Vorschlag","Die Stadt könnte mehr sichere Radwege bauen."]],words:[["die Verbindung","fifandraisana / zotra","la liaison"],["der Fahrplan","fandaharam-potoana","l’horaire"],["die Umleitung","lalana hafa","la déviation"],["die Beschwerde","fitarainana","la réclamation"],["der Nahverkehr","fitateram-bahoaka akaiky","les transports locaux"],["umweltfreundlich","tsy manimba tontolo iainana","écologique"]],dialog:[["Fahrgast","Entschuldigung, mein Zug ist zum zweiten Mal ausgefallen."],["Mitarbeiterin","Das tut mir leid. Es gibt einen Ersatzbus."],["Fahrgast","Könnten Sie mir sagen, wo er abfährt?"],["Mitarbeiterin","Natürlich. Er fährt vor dem Haupteingang ab."]],reading:"In einer Umfrage wünschen sich viele Einwohner zuverlässige Busse und sichere Fahrradwege. Häufige Verspätungen machen den Arbeitsweg schwierig. Die Stadt prüft deshalb, ob Fahrpläne verbessert und Umsteigezeiten verkürzt werden können.",writing:"Schreibe eine Beschwerde an ein Verkehrsunternehmen. Beschreibe eine konkrete Störung, nenne Datum und Folgen und bitte höflich um eine Erklärung oder Verbesserung.",speaking:"Vergleiche Auto, Fahrrad und öffentliche Verkehrsmittel. Bewerte Kosten, Zeit, Komfort und Umwelt und schlage eine Lösung für deine Stadt vor.",quiz:["Welche Passivform ist richtig?",["Die Haltestelle wird umgebaut.","Die Haltestelle wird umbauen.","Die Haltestelle ist umbauen."],0]},
{goal:"Du kannst Gefühle differenziert benennen, Eigenschaften beschreiben, Missverständnisse erklären und Konflikte respektvoll lösen.",grammar:"Reflexive Verben brauchen ein Reflexivpronomen: „Ich ärgere mich über die Verspätung.“ Relativsätze beschreiben Personen oder Dinge genauer. Obwohl und während verbinden Nebensätze, in denen das Verb am Ende steht. Trotzdem verbindet häufig zwei Hauptsätze: „Ich war enttäuscht. Trotzdem habe ich ruhig reagiert.“",examples:[["Reflexiv","Ich freue mich auf das Treffen."],["Relativsatz","Eine Person, die gut zuhört, kann Konflikte oft entschärfen."],["obwohl","Obwohl ich verletzt war, habe ich sachlich gesprochen."],["trotzdem","Wir waren verschiedener Meinung. Trotzdem fanden wir eine Lösung."]],words:[["die Enttäuschung","fahadisoam-panantenana","la déception"],["die Eigenschaft","toetra","le trait de caractère"],["das Missverständnis","tsy fifankahazoana","le malentendu"],["Rücksicht nehmen","mihevitra ny hafa","tenir compte des autres"],["sich entschuldigen","miala tsiny","s’excuser"],["die Vereinbarung","fifanarahana","l’accord"]],dialog:[["A","Ich war enttäuscht, weil du nicht Bescheid gesagt hast."],["B","Du hast recht. Es tut mir leid."],["A","Mir ist wichtig, dass wir Änderungen rechtzeitig mitteilen."],["B","Das verstehe ich. Beim nächsten Mal schreibe ich dir sofort."]],reading:"Konflikte entstehen oft, wenn Erwartungen nicht ausgesprochen werden. Hilfreich ist, die eigene Wahrnehmung zu beschreiben, statt die andere Person anzugreifen. Aktives Zuhören und konkrete Absprachen können Missverständnisse verringern.",writing:"Schreibe über ein alltägliches Missverständnis. Beschreibe die Gefühle beider Personen, erkläre die Ursache und formuliere eine respektvolle Lösung.",speaking:"Spielt ein Konfliktgespräch. Verwende Ich-Botschaften, höre aktiv zu, entschuldige dich gegebenenfalls und einigt euch auf eine konkrete Vereinbarung.",quiz:["Welche Formulierung zeigt einen Gegensatz korrekt?",["Obwohl ich enttäuscht war, blieb ich ruhig.","Obwohl ich war enttäuscht, blieb ich ruhig.","Obwohl enttäuscht war ich, ich blieb ruhig."],0]},
{goal:"Du kannst Essgewohnheiten vergleichen, Rezepte erklären, eine Einladung beantworten und einen Restaurantbesuch bewerten.",grammar:"Bei Vorgangsbeschreibungen helfen zuerst, danach, anschließend und zum Schluss. Wenn beschreibt Bedingungen oder wiederholte Situationen; als beschreibt einen einmaligen Zeitpunkt in der Vergangenheit. Im Passiv steht die Handlung im Mittelpunkt: „Die Zutaten werden gemischt.“ Höfliche Wünsche formuliert man mit „Ich hätte gern …“ oder „Könnten Sie …?“",examples:[["Reihenfolge","Zuerst werden die Zwiebeln geschnitten, danach werden sie angebraten."],["wenn","Wenn ich Zeit habe, koche ich frisch."],["als","Als ich in Paris war, probierte ich ein neues Gericht."],["Höfliche Bestellung","Ich hätte gern die Gemüsesuppe, bitte."]],words:[["die Zutat","akora ilaina","l’ingrédient"],["die Ernährung","sakafo sy fomba fihinana","l’alimentation"],["die Mahlzeit","sakafo","le repas"],["die Speisekarte","lisitry ny sakafo","le menu"],["die Einladung","fanasana","l’invitation"],["die Beilage","sakafo miaraka","l’accompagnement"]],dialog:[["Gast","Guten Abend. Haben Sie auch vegetarische Gerichte?"],["Servicekraft","Ja, wir haben eine Gemüsepfanne und eine Linsensuppe."],["Gast","Dann hätte ich gern die Linsensuppe."],["Servicekraft","Sehr gern. Möchten Sie noch etwas trinken?"]],reading:"In einer Familie essen nicht alle zur gleichen Zeit. Deshalb wird am Wochenende oft ein Gericht vorbereitet, das sich leicht aufwärmen lässt. Beim Kochen achtet die Familie auf frische Zutaten und darauf, Lebensmittelreste sinnvoll zu verwenden.",writing:"Schreibe ein Rezept mit Zutaten, Mengenangaben und mindestens sechs Arbeitsschritten. Ergänze eine Einladung zum Essen und eine höfliche Antwort darauf.",speaking:"Erkläre deiner Partnerin oder deinem Partner ein Rezept. Spielt anschließend einen Restaurantbesuch mit einer Frage zu Zutaten und einer höflichen Sonderbestellung.",quiz:["Welche Form ist eine höfliche Bestellung?",["Ich hätte gern die Suppe, bitte.","Ich will Suppe sofort.","Gib mir die Suppe."],0]}

{goal:"Du kannst berufliche Entscheidungen reflektieren, Lebensläufe auswerten und Arbeitsbedingungen mit präziser Sprache beurteilen.",grammar:"Im B2-Bereich werden Aussagen stärker verdichtet. Statt „weil die Arbeit anstrengend ist“ kann man „aufgrund der hohen Arbeitsbelastung“ schreiben. Modalverben können Vermutungen ausdrücken: „Er dürfte bereits angekommen sein.“ Partizipialattribute verdichten Informationen: „die im letzten Jahr eingeführte Regelung“. Achte darauf, ob eine Aussage Tatsache, Vermutung oder Bewertung ist.",examples:[["Nominale Formulierung","Aufgrund der hohen Belastung wurde die Stelle neu organisiert."],["Vermutung","Die Bewerberin dürfte bereits Berufserfahrung haben."],["Partizipialattribut","Die im vergangenen Jahr eingeführte Regelung wird überprüft."],["Abwägung","Einerseits bietet die Spezialisierung Chancen, andererseits schränkt sie die Auswahl ein."]],words:[["die Berufswahl","safidy asa","le choix professionnel"],["die Voraussetzung","fepetra takiana","la condition préalable"],["die Qualifikation","fahaiza-manao voamarina","la qualification"],["die Belastbarkeit","fahazakana enta-mavesatra","la résistance"],["die Laufbahn","lalan’asa","la carrière"],["die Rahmenbedingung","toe-javatra fototra","la condition-cadre"]],dialog:[["Beraterin","Welche Kriterien sind für Ihre Berufswahl entscheidend?"],["Bewerber","Neben den Entwicklungsmöglichkeiten sind mir verlässliche Arbeitsbedingungen wichtig."],["Beraterin","Wie begründen Sie diese Priorität?"],["Bewerber","Sie schafft Planungssicherheit und trägt langfristig zur Arbeitszufriedenheit bei."]],reading:"Berufliche Entscheidungen hängen selten von einem einzigen Faktor ab. Neben Gehalt und Aufstiegsmöglichkeiten spielen Arbeitsklima, Weiterbildungsangebote und Vereinbarkeit eine Rolle. Eine fundierte Entscheidung setzt voraus, dass persönliche Ziele mit den tatsächlichen Rahmenbedingungen abgeglichen werden.",writing:"Verfasse eine strukturierte Stellungnahme (180–220 Wörter): Welche Faktoren sollten bei der Berufswahl besonders berücksichtigt werden? Formuliere eine These, zwei begründete Argumente, ein Gegenargument und ein Fazit.",speaking:"Präsentiere deine beruflichen Prioritäten und verteidige sie in einer Diskussion. Reagiere auf Einwände und differenziere zwischen kurzfristigen und langfristigen Folgen.",quiz:["Welche Formulierung klingt sachlich und präzise?",["Aufgrund veränderter Rahmenbedingungen wurde die Stelle neu organisiert.","Weil die Bedingungen sich geändert haben, hat man halt alles anders gemacht.","Die Stelle wurde irgendwie anders gemacht."],0]},
{goal:"Du kannst Wohn- und Reiseerfahrungen vergleichen, Probleme sachlich schildern und formelle Beschwerden überzeugend formulieren.",grammar:"Relativsätze mit wo beziehen sich oft auf Orte: „Das ist die Stadt, wo ich studiert habe“; formeller ist häufig „in der ich studiert habe“. Das Passiv betont Vorgänge oder Ergebnisse: „Die Reservierung wurde bestätigt.“ In formellen Texten lassen sich Verben nominalisieren: „Wir beschweren uns über den Lärm“ → „unsere Beschwerde wegen des Lärms“.",examples:[["Relativsatz","Das Viertel, in dem ich wohne, ist gut angebunden."],["Passiv","Die Reservierung wurde trotz Bestätigung nicht gefunden."],["Nominalisierung","Wegen der kurzfristigen Stornierung verlangen wir eine Erklärung."],["Beschwerde","Ich bitte Sie, den Sachverhalt zu prüfen und mir schriftlich zu antworten."]],words:[["die Wohnform","endrika fonenana","le type de logement"],["die Anbindung","fifandraisana amin’ny fitaterana","la desserte"],["die Unterkunft","toeram-ponenana","l’hébergement"],["die Stornierung","fanafoanana famandrihana","l’annulation"],["der Mangel","lesoka","le défaut"],["der Sachverhalt","zava-misy","les faits"]],dialog:[["Kundin","Ich möchte eine Beschwerde über meine Unterkunft einreichen."],["Mitarbeiter","Können Sie den Mangel genauer beschreiben?"],["Kundin","Das Zimmer war bei der Ankunft nicht gereinigt, obwohl dies bestätigt wurde."],["Mitarbeiter","Ich verstehe. Wir prüfen den Vorgang und melden uns schriftlich."]],reading:"Eine gute Beschwerde beschreibt überprüfbare Tatsachen und vermeidet persönliche Angriffe. Wichtig sind Datum, Buchungsnummer, konkrete Mängel und eine realistische Forderung. Sachliche Formulierungen erhöhen die Chance, dass der Fall nachvollziehbar geprüft werden kann.",writing:"Schreibe eine formelle Beschwerde (180–220 Wörter) über eine Unterkunft oder eine Reiseleistung. Beschreibe den Ablauf chronologisch, belege deine Kritik und formuliere eine konkrete Forderung.",speaking:"Berichte über eine Reiseerfahrung und begründe, welche Aspekte für gute Unterkünfte und eine lebenswerte Stadt besonders wichtig sind.",quiz:["Welche Beschwerde ist am sachlichsten?",["Ich bitte Sie, den beschriebenen Mangel zu prüfen und mir eine Lösung vorzuschlagen.","Ihr Service ist schrecklich und alle sind unfähig.","Ich bin sauer und will sofort irgendwas."],0]},
{goal:"Du kannst interkulturelle Erfahrungen analysieren, Perspektiven vergleichen und über Europa und Auslandsaufenthalte differenziert sprechen.",grammar:"Nominalisierung macht Texte kompakter: „Menschen ziehen ins Ausland“ → „die Auswanderung“. Kausalität drückt man mit aufgrund, wegen, da oder weil aus; Folgen mit daher, infolgedessen oder sodass. Verben mit Präpositionen werden zusammen gelernt: sich beschäftigen mit + Dativ, abhängen von + Dativ, sich auseinandersetzen mit + Dativ. In Diskussionen unterscheidet man persönliche Erfahrung von allgemeiner Aussage.",examples:[["Nominalisierung","Die zunehmende Mobilität verändert berufliche Lebenswege."],["Ursache und Folge","Da Abschlüsse unterschiedlich anerkannt werden, benötigen viele Menschen Beratung."],["Verb mit Präposition","Sie setzt sich intensiv mit kulturellen Unterschieden auseinander."],["Differenzierung","Diese Erfahrung ist persönlich; sie lässt sich nicht ohne Weiteres verallgemeinern."]],words:[["die Vielfalt","fahasamihafana","la diversité"],["die Anerkennung","fanekena","la reconnaissance"],["die Zugehörigkeit","fahatsapana ho anisan’ny vondrona","l’appartenance"],["die Perspektive","fomba fijery","la perspective"],["die Anpassung","fampifanarahana","l’adaptation"],["das Vorurteil","fitsarana mialoha","le préjugé"]],dialog:[["A","Welche Vorteile bietet ein Auslandsaufenthalt?"],["B","Er erweitert oft den Blick auf andere Lebensweisen und verbessert Sprachkenntnisse."],["A","Gibt es auch Herausforderungen?"],["B","Ja. Die Anerkennung von Abschlüssen und das Gefühl der Zugehörigkeit können schwierig sein."]],reading:"Internationale Mobilität schafft Möglichkeiten, bringt jedoch auch Herausforderungen mit sich. Menschen lernen neue Perspektiven kennen, müssen sich aber zugleich in rechtlichen, sprachlichen und sozialen Strukturen orientieren. Integrationsprozesse gelingen besser, wenn gegenseitige Erwartungen offen angesprochen werden.",writing:"Verfasse einen argumentativen Text (200–250 Wörter) über Chancen und Herausforderungen eines Auslandsaufenthalts. Nutze mindestens drei Konnektoren für Ursache, Folge und Gegensatz.",speaking:"Diskutiere, welche Bedingungen internationale Begegnungen erfolgreich machen. Unterscheide eigene Erfahrungen von allgemeinen Schlussfolgerungen.",quiz:["Welche Formulierung vermeidet eine pauschale Verallgemeinerung?",["Die Erfahrungen unterscheiden sich je nach Lebenslage und Rahmenbedingungen.","Alle Menschen erleben einen Auslandsaufenthalt gleich.","Wer ins Ausland geht, hat nie Schwierigkeiten."],0]},
{goal:"Du kannst nachhaltigen Konsum und wirtschaftliche Entwicklungen abwägen, Stress am Arbeitsplatz analysieren und geschäftliche E-Mails verfassen.",grammar:"Konjunktiv II beschreibt hypothetische Situationen und höfliche Vorschläge: „Wenn Unternehmen flexiblere Arbeitszeiten anböten, könnten Beschäftigte Beruf und Familie besser vereinbaren.“ Funktionsverbgefüge verbinden ein Nomen mit einem Verb: eine Entscheidung treffen, Verantwortung übernehmen, Maßnahmen ergreifen. In Nebensätzen steht das finite Verb am Ende; mehrere Angaben sollten logisch geordnet werden.",examples:[["Hypothese","Wenn Produkte länger hielten, würde weniger Abfall entstehen."],["Funktionsverbgefüge","Das Unternehmen hat Maßnahmen zur Energieeinsparung ergriffen."],["Formelle E-Mail","Ich möchte mich erkundigen, ob die Unterlagen bereits vorliegen."],["Abwägung","Die Investition ist zunächst teuer, könnte sich langfristig jedoch auszahlen."]],words:[["die Lieferkette","rohy famatsiana","la chaîne d’approvisionnement"],["die Nachhaltigkeit","faharetana sy fiarovana ny tontolo iainana","la durabilité"],["die Investition","fampiasam-bola","l’investissement"],["die Verantwortung","andraikitra","la responsabilité"],["die Vereinbarkeit","fahafahana mampifanaraka","la conciliation"],["die Maßnahme ergreifen","mandray fepetra","prendre des mesures"]],dialog:[["Mitarbeiter","Wir sollten die Lieferkosten und die Umweltfolgen gemeinsam bewerten."],["Kollegin","Einverstanden. Wenn wir langlebigere Materialien wählten, könnten wir Abfall reduzieren."],["Mitarbeiter","Die Kosten wären anfangs höher."],["Kollegin","Das stimmt; langfristig könnte die bessere Qualität aber wirtschaftlich sein."]],reading:"Nachhaltigkeit wird in Unternehmen zunehmend als wirtschaftliche und gesellschaftliche Aufgabe betrachtet. Entscheidend ist, ob Maßnahmen messbare Verbesserungen erzielen. Dazu gehören langlebige Produkte, transparente Lieferketten und Arbeitsbedingungen, die langfristige Gesundheit ermöglichen.",writing:"Schreibe eine formelle E-Mail an ein Unternehmen und bitte um Informationen zu nachhaltigen Produkten oder Arbeitsbedingungen. Verfasse danach eine kurze Stellungnahme zu Kosten und langfristigem Nutzen.",speaking:"Diskutiere, ob nachhaltiger Konsum vor allem Aufgabe der Verbraucher oder der Unternehmen ist. Entwickle zwei Argumente und antworte auf ein Gegenargument.",quiz:["Welches Funktionsverbgefüge ist korrekt?",["eine Entscheidung treffen","eine Entscheidung machen nehmen","eine Entscheidung tun"],0]},
{goal:"Du kannst Zeitmanagement, Freizeit und digitale Medien analysieren, eine Strategie begründen und Ziele präzise formulieren.",grammar:"Finalangaben nennen ein Ziel: um … zu bei gleichem Subjekt, damit bei unterschiedlichen Subjekten. Konditionalsätze formulieren Voraussetzungen: „Falls die Zeit knapp wird, kürzen wir den Vortrag.“ Temporale Angaben können als Nebensatz oder Nominalgruppe auftreten: „Nachdem ich die Aufgabe beendet hatte …“ / „Nach Abschluss der Aufgabe …“. Im B2-Stil kann man Satzmuster variieren, ohne die Verständlichkeit zu verlieren.",examples:[["Finalsatz","Ich schalte Benachrichtigungen aus, um konzentrierter zu arbeiten."],["damit","Wir verteilen die Aufgaben, damit alle rechtzeitig fertig werden."],["Bedingung","Falls sich der Termin ändert, informiere ich das Team."],["Nominalisierung","Nach Abschluss der Lektüre fasse ich die Kernaussagen zusammen."]],words:[["die Priorität","laharam-pahamehana","la priorité"],["die Ablenkung","fanelingelenana","la distraction"],["die Zeitspanne","fe-potoana","la période"],["die Zielsetzung","fametrahana tanjona","la définition d’objectifs"],["die Ausgewogenheit","fifandanjana","l’équilibre"],["die Gewohnheit","fahazarana","l’habitude"]],dialog:[["A","Wie schaffst du es, Arbeit und Freizeit zu verbinden?"],["B","Ich setze klare Prioritäten, damit wichtige Aufgaben nicht bis zum Abend liegen bleiben."],["A","Und was machst du gegen digitale Ablenkungen?"],["B","Ich schalte Mitteilungen aus, um konzentriert arbeiten zu können."]],reading:"Digitale Geräte erleichtern den Zugang zu Informationen, können jedoch die Aufmerksamkeit unterbrechen. Wer konzentrierte Arbeitsphasen plant und Pausen bewusst nutzt, kann die eigene Zeit oft besser strukturieren. Eine wirksame Strategie muss zum persönlichen Alltag passen und regelmäßig überprüft werden.",writing:"Verfasse einen Ratgebertext (180–220 Wörter) zum Thema Zeitmanagement. Erkläre ein Problem, beschreibe drei konkrete Strategien und nenne Bedingungen, unter denen sie funktionieren.",speaking:"Präsentiere deine Methode zur Organisation einer arbeitsreichen Woche. Begründe, warum sie wirkt, und diskutiere mögliche Grenzen.",quiz:["Welcher Satz drückt ein Ziel korrekt aus?",["Ich plane den Tag, um die Aufgaben rechtzeitig zu erledigen.","Ich plane den Tag, um ich erledige die Aufgaben.","Ich plane den Tag, damit die Aufgaben rechtzeitig erledigen."],0]},
{goal:"Du kannst Informationen aus Nachrichten beurteilen, Gerüchte überprüfen und gesellschaftliches Engagement differenziert diskutieren.",grammar:"Konjunktiv I wird häufig in der indirekten Rede verwendet: „Die Sprecherin sagt, die Lage sei stabil.“ Wenn die Form mit dem Indikativ identisch ist, kann Konjunktiv II als Ersatz dienen. Nomen-Verb-Verbindungen wie Kritik üben, Verantwortung übernehmen oder einen Beitrag leisten sind typisch für sachliche Texte. Quellenangaben und Distanzmarker zeigen, ob Informationen bestätigt oder noch unsicher sind.",examples:[["Indirekte Rede","Der Bericht erklärt, die Zahlen seien noch vorläufig."],["Distanz","Nach Angaben der Behörde wurde die Untersuchung fortgesetzt."],["Nomen-Verb-Verbindung","Die Organisation leistet einen wichtigen Beitrag."],["Quellenprüfung","Die Behauptung ist bislang nicht durch unabhängige Quellen bestätigt."]],words:[["die Berichterstattung","fandrakofam-baovao","la couverture médiatique"],["die Behauptung","filazana","l’affirmation"],["die Untersuchung","fanadihadiana","l’enquête"],["das Engagement","fandraisana anjara","l’engagement"],["die Glaubwürdigkeit","fahamarinan-toerana","la crédibilité"],["einen Beitrag leisten","mandray anjara","contribuer"]],dialog:[["A","In einem Beitrag heißt es, die Zahlen seien stark gestiegen."],["B","Welche Quelle nennt der Beitrag?"],["A","Er verweist auf eine Untersuchung, aber ich habe die Originaldaten noch nicht gefunden."],["B","Dann sollten wir die Aussage vorerst als unbestätigt kennzeichnen."]],reading:"Die schnelle Verbreitung von Informationen erhöht die Bedeutung sorgfältiger Prüfung. Eine seriöse Analyse unterscheidet zwischen bestätigten Tatsachen, Einschätzungen und offenen Fragen. Dabei helfen die Originalquelle, der Veröffentlichungszeitpunkt und unabhängige Bestätigungen.",writing:"Fasse eine gesellschaftliche Nachricht zusammen und markiere, welche Aussagen bestätigt, zugeschrieben oder noch unklar sind. Verwende mindestens zwei Formen der indirekten Rede.",speaking:"Diskutiere, wie Schulen oder Gemeinden gegen Falschinformationen vorgehen könnten. Nenne konkrete Maßnahmen und berücksichtige mögliche Grenzen.",quiz:["Welche Form der indirekten Rede ist korrekt?",["Der Bericht erklärt, die Zahlen seien vorläufig.","Der Bericht erklärt, die Zahlen sind seien vorläufig.","Der Bericht erklärt, die Zahlen vorläufig seien sind."],0]},
{goal:"Du kannst technische Produkte und Zukunftstechnologien beurteilen, Risiken abwägen und eine Präsentation über eine Erfindung strukturieren.",grammar:"Passiversatzformen drücken ähnliche Bedeutungen aus: „Das Problem kann gelöst werden“ / „Das Problem lässt sich lösen“ / „Das Problem ist lösbar“. Partizipien können als Adjektive verwendet werden: „die entwickelte Anwendung“, „ein gut funktionierendes Gerät“. Modalverben drücken Vermutungen aus: „Das dürfte die neueste Version sein.“ Komparation hilft, Produkte anhand klarer Kriterien zu bewerten.",examples:[["Passiversatz","Die Daten lassen sich schnell übertragen."],["Partizip I","Ein energiesparendes Gerät reduziert den Verbrauch."],["Partizip II","Die entwickelte Anwendung wird getestet."],["Vermutung","Die neue Funktion dürfte viele Arbeitsabläufe vereinfachen."]],words:[["die Anwendung","fampiharana","l’application"],["die Zuverlässigkeit","fahamarinan-toerana","la fiabilité"],["die Datensicherheit","fiarovana ny angona","la sécurité des données"],["die Entwicklung","fivoarana","le développement"],["die Voraussetzung","fepetra takiana","la condition préalable"],["die Auswirkung","vokany","la conséquence"]],dialog:[["A","Welche Vorteile bietet die neue Anwendung?"],["B","Viele Arbeitsschritte lassen sich damit automatisieren."],["A","Welche Risiken müssen wir beachten?"],["B","Vor allem Datenschutz, Fehleranfälligkeit und die Abhängigkeit von der Technik."]],reading:"Neue Technologien können Abläufe beschleunigen und neue Dienstleistungen ermöglichen. Ihr Nutzen hängt jedoch von Zuverlässigkeit, Datenschutz, Zugänglichkeit und menschlicher Kontrolle ab. Eine ausgewogene Bewertung vergleicht nicht nur die Funktionen, sondern auch mögliche Folgen für Beschäftigte und Gesellschaft.",writing:"Verfasse einen strukturierten Kurzvortrag über eine technische Erfindung. Beschreibe Funktion, Nutzen, Grenzen und mögliche gesellschaftliche Folgen; formuliere anschließend eine begründete Bewertung.",speaking:"Halte einen drei- bis vierminütigen Vortrag zu einer Zukunftstechnologie. Nutze eine klare Einleitung, drei Hauptpunkte, ein Beispiel und ein Fazit.",quiz:["Welche Passiversatzform ist korrekt?",["Die Daten lassen sich verschlüsseln.","Die Daten lassen verschlüsseln sich.","Die Daten sich lassen verschlüsseln."],0]},

}
