<script>

/* =====================================================
   AUDIO GLOBAL
===================================================== */

let currentSpeech = null;


/* =====================================================
   TEXTES AUDIO DES 4 GRANDES RUBRIQUES
===================================================== */

const tabAudio = {

    regelmaessig:
        "Regelmäßige Verben. Bei regelmäßigen Verben bleibt der Verbstamm meistens gleich.",

    unregelmaessig:
        "Unregelmäßige Verben. Bei unregelmäßigen Verben kann sich der Vokal im Verbstamm verändern. Achte besonders auf du und er, sie, es.",

    modalverben:
        "Modalverben. Modalverben zeigen zum Beispiel Fähigkeit, Pflicht, Wunsch oder Erlaubnis. Das zweite Verb steht meistens am Ende des Satzes im Infinitiv.",

    summary:
        "Zusammenfassung. Regelmäßige Verben: Der Stamm bleibt gleich. Unregelmäßige Verben: Der Stammvokal kann sich ändern. Modalverben: Das zweite Verb steht am Satzende im Infinitiv."

};


/* =====================================================
   AUDIO
===================================================== */

function playAudio(text) {

    if (!('speechSynthesis' in window)) {

        alert('Audio non supporté par ce navigateur.');

        return;

    }

    /*
       Stoppe immer den vorherigen Audio
    */

    window.speechSynthesis.cancel();


    if (!text || !text.trim()) {
        return;
    }


    currentSpeech =
        new SpeechSynthesisUtterance(text);


    currentSpeech.lang = 'de-DE';

    currentSpeech.rate = 0.88;

    currentSpeech.pitch = 1;

    currentSpeech.volume = 1;


    window.speechSynthesis.speak(
        currentSpeech
    );

}


/* =====================================================
   TEXTE FÜR AUTOMATISCHE AUDIOAUSGABE
===================================================== */

function getGermanText(element) {

    /*
       Wir erstellen eine Kopie,
       damit der originale Inhalt nicht verändert wird.
    */

    const clone = element.cloneNode(true);


    /*
       Französische Übersetzungen entfernen
    */

    clone
        .querySelectorAll(
            '.fr-sub, .ex-fr, .verb-translation'
        )
        .forEach(el => el.remove());


    /*
       Audio-Buttons entfernen
    */

    clone
        .querySelectorAll(
            '.play-btn, button, input'
        )
        .forEach(el => el.remove());


    /*
       Emojis teilweise entfernen
    */

    let text = clone.innerText || clone.textContent || '';


    /*
       Mehrere Leerzeichen reduzieren
    */

    text = text
        .replace(/\s+/g, ' ')
        .trim();


    return text;

}


/* =====================================================
   TAB SWITCH
===================================================== */

function switchTab(caseName, button) {

    /*
       Alle Tabs schließen
    */

    document
        .querySelectorAll('.tab-content')
        .forEach(tab => {

            tab.classList.remove('active');

        });


    /*
       Alle Side Panels schließen
    */

    document
        .querySelectorAll('.side-content')
        .forEach(side => {

            side.classList.remove('active');

        });


    /*
       Alle Buttons deaktivieren
    */

    document
        .querySelectorAll('.nav-btn')
        .forEach(btn => {

            btn.classList.remove('active');

        });


    /*
       Theme bestimmen
    */

    let theme = 'theme-reg';


    if (caseName === 'unregelmaessig') {

        theme = 'theme-unr';

    }


    if (caseName === 'modalverben') {

        theme = 'theme-mod';

    }


    if (caseName === 'summary') {

        theme = 'theme-sum';

    }


    document.body.className = theme;


    /*
       Gewählten Tab öffnen
    */

    const selectedTab =
        document.getElementById(caseName);


    if (selectedTab) {

        selectedTab.classList.add('active');

    }


    /*
       Side Panel öffnen
    */

    const selectedSide =
        document.getElementById(
            'side-' + caseName
        );


    if (selectedSide) {

        selectedSide.classList.add('active');

    }


    /*
       Button aktivieren
    */

    button.classList.add('active');


    /*
       🔊 AUTOMATISCHES AUDIO
    */

    if (tabAudio[caseName]) {

        playAudio(
            tabAudio[caseName]
        );

    }

}


/* =====================================================
   COLLAPSIBLE SECTIONS
===================================================== */

function toggleSection(button) {

    const content =
        button.nextElementSibling;


    if (!content) {
        return;
    }


    const isOpen =
        content.classList.contains('open');


    /*
       Wenn bereits geöffnet:
       schließen
    */

    if (isOpen) {

        content.classList.remove('open');

        button.classList.remove('open');

        /*
           Audio stoppen
        */

        if ('speechSynthesis' in window) {

            window.speechSynthesis.cancel();

        }

        return;

    }


    /*
       Abschnitt öffnen
    */

    content.classList.add('open');

    button.classList.add('open');


    /*
       🔊 AUTOMATISCHES AUDIO
    */

    const germanText =
        getGermanText(content);


    if (germanText) {

        /*
           Kleine Verzögerung,
           damit das Öffnen sichtbar ist.
        */

        setTimeout(() => {

            playAudio(germanText);

        }, 150);

    }

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value) {

    return value
        .trim()
        .toLowerCase();

}


/* =====================================================
   REGULAR VERBS
===================================================== */

function checkRegular() {

    const answers = [

        'wohnen',
        'fragst',
        'spielt',
        'koche',
        'macht',
        'hören',
        'kaufen'

    ];


    let correct = 0;


    for (
        let i = 1;
        i <= 7;
        i++
    ) {

        const input =
            document.getElementById(
                'reg' + i
            );


        if (
            normalize(input.value) ===
            answers[i - 1]
        ) {

            correct++;

            input.style.borderColor =
                '#059669';

        } else {

            input.style.borderColor =
                '#e11d48';

        }

    }


    const feedback =
        document.getElementById(
            'feedback-reg'
        );


    if (correct === 7) {

        feedback.className =
            'feedback correct';

        feedback.textContent =
            '🎉 Perfekt! 7/7 richtig!';


        playAudio(
            'Perfekt! Sieben von sieben Antworten sind richtig!'
        );

    } else {

        feedback.className =
            'feedback wrong';

        feedback.textContent =
            `❌ ${correct}/7 richtig. Versuche es noch einmal!`;


        playAudio(
            `${correct} von sieben Antworten sind richtig. Versuche es noch einmal.`
        );

    }

}

/* =====================================================
   MODALVERBEN
===================================================== */

function checkModal() {

    const answers = [

        'kannst',

        'will',
        'dürft',

    ];

        feedback.className =

        playAudio(

        feedback.className =
            'feedback wrong';

        feedback.textContent =

/* =====================================================
   STOP AUDIO BEIM VERLASSEN DER SEITE
===================================================== */

window.addEventListener(
    'beforeunload',
    () => {

        if ('speechSynthesis' in window) {

            window.speechSynthesis.cancel();

        }

    }
);

</script>
