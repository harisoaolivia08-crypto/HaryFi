<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HaryFi – Lektion 2: Seite 3</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap');

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #17120d;

            background: linear-gradient(
                -45deg,
                #ff4500,
                #ff7e00,
                #ffd000,
                #00c9ff,
                #7c3aed,
                #ff3cac
            );

            background-size: 500% 500%;
            animation: gradientMove 18s ease infinite;
        }


        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            25% {
                background-position: 100% 50%;
            }

            50% {
                background-position: 100% 100%;
            }

            75% {
                background-position: 0% 100%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        .glass {

            background: rgba(255, 255, 255, .22);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            border: 1px solid rgba(255, 255, 255, .45);

        }


        .video-card {

            background: rgba(255, 255, 255, .92);

            border-radius: 32px;

            padding: 20px;

            box-shadow:
                0 20px 45px rgba(0, 0, 0, .18);

        }


        .video-container {

            position: relative;

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            border-radius: 24px;

            background: #000;

            box-shadow:
                0 15px 35px rgba(0, 0, 0, .25);

        }


        .video-container iframe {

            position: absolute;

            inset: 0;

            width: 100%;
            height: 100%;

            border: 0;

        }


        .start-button {

            transition:
                transform .2s ease,
                box-shadow .2s ease;

        }


        .start-button:hover {

            transform: scale(1.04);

            box-shadow:
                0 20px 45px rgba(0, 0, 0, .25);

        }


        .start-button:active {

            transform: scale(.96);

        }


        .status {

            min-height: 25px;

            margin-top: 18px;

            font-weight: 800;

            opacity: .8;

        }


        .navigation-button {

            transition:
                transform .2s ease,
                box-shadow .2s ease;

        }


        .navigation-button:hover {

            transform: translateY(-4px);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, .20);

        }

    </style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="px-5 py-5">

    <div class="
        max-w-7xl
        mx-auto
        flex
        items-center
        justify-between
        gap-4
    ">

        <a
            href="lektion2.html"
            class="
                glass
                rounded-2xl
                px-5
                py-3
                font-black
                text-lg
            "
        >
            ← Lektion 2
        </a>


        <div class="
            glass
            rounded-full
            px-5
            py-2
            font-bold
            text-sm
        ">
            🇩🇪 Deutschkurs
        </div>

    </div>

</header>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="
    max-w-6xl
    mx-auto
    px-5
    pb-20
">


<!-- =====================================================
     TITRE
===================================================== -->

<section class="
    text-center
    pt-8
    pb-10
">

    <div class="
        inline-block
        glass
        rounded-full
        px-5
        py-2
        mb-5
        text-xs
        font-black
        uppercase
        tracking-widest
    ">
        Lektion 2 · Seite 3
    </div>


    <h1 class="
        text-5xl
        md:text-7xl
        font-black
        tracking-tight
        mb-5
    ">
        Video
    </h1>


    <p class="
        text-lg
        md:text-xl
        font-semibold
        max-w-3xl
        mx-auto
    ">
        Schau dir das Video an und übe die deutsche Sprache.
    </p>


    <div
        id="status"
        class="status"
    >
        Klicke auf „Video starten“.
    </div>

</section>



<!-- =====================================================
     VIDEO
===================================================== -->

<section class="video-card">


    <div class="text-center mb-7">

        <div class="text-5xl mb-4">
            🎬
        </div>


        <h2 class="
            text-3xl
            md:text-4xl
            font-black
        ">
            Deutsch lernen
        </h2>


        <p class="
            mt-3
            font-semibold
            opacity-70
        ">
            Schau das Video und wiederhole die Sätze laut.
        </p>

    </div>



    <!-- =================================================
         YOUTUBE VIDEO
    ================================================== -->

    <div
        id="videoContainer"
        class="video-container"
    >

        <iframe
            id="youtubeVideo"
            src="https://www.youtube.com/embed/tUKzXcfVLsM?rel=0"
            title="HaryFi – Lektion 2"
            allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share
            "
            allowfullscreen
        >
        </iframe>

    </div>



    <!-- =================================================
         BOUTON
    ================================================== -->

    <div class="flex justify-center mt-7">

        <button
            id="startButton"
            type="button"
            class="
                start-button
                bg-black
                text-white
                px-9
                py-4
                rounded-2xl
                font-black
                text-lg
                shadow-xl
            "
        >
            ▶️ Video starten
        </button>

    </div>


</section>



<!-- =====================================================
     NAVIGATION
===================================================== -->

<section class="
    flex
    flex-col
    sm:flex-row
    justify-center
    items-center
    gap-4
    mt-14
">


    <a
        href="lektion2_page2.html"
        class="
            navigation-button
            bg-black
            text-white
            px-8
            py-4
            rounded-2xl
            font-black
            shadow-xl
        "
    >
        ← Seite 2
    </a>


    <a
        href="lektion2.html"
        class="
            navigation-button
            bg-white
            px-8
            py-4
            rounded-2xl
            font-black
            shadow-xl
        "
    >
        Lektion 2
    </a>


</section>


</main>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


const startButton =
    document.getElementById("startButton");


const youtubeVideo =
    document.getElementById("youtubeVideo");


const status =
    document.getElementById("status");



startButton.addEventListener(
    "click",
    () => {

        youtubeVideo.src =
            "https://www.youtube.com/embed/tUKzXcfVLsM?autoplay=1&rel=0";


        status.textContent =
            "🎬 Video wird gestartet.";

    }
);


</script>


</body>

</html>
