/* =====================================================
   VOCAL – PERSONALPRONOMEN
====================================================== */

function speakPronoun(word, button) {


  /*
   * Stoppe die aktuelle Aussprache.
   */

  window.speechSynthesis.cancel();


  /*
   * Entferne Animation von allen
   * anderen Buttons.
   */

  document
    .querySelectorAll(".voice-button")
    .forEach(function(btn) {

      btn.classList.remove(
        "speaking"
      );

    });


  /*
   * Neues Sprachobjekt.
   */

  const speech =
    new SpeechSynthesisUtterance(word);


  /*
   * Deutsch einstellen.
   */

  speech.lang = "de-DE";


  /*
   * Geschwindigkeit.
   *
   * 0.75 = langsam und
   * gut für Deutschlerner.
   */

  speech.rate = 0.75;


  /*
   * Normale Tonhöhe.
   */

  speech.pitch = 1;


  /*
   * Lautstärke.
   */

  speech.volume = 1;


  /*
   * Animation starten.
   */

  button.classList.add(
    "speaking"
  );


  /*
   * Wenn die Aussprache
   * beendet ist.
   */

  speech.onend = function() {

    button.classList.remove(
      "speaking"
    );

  };


  /*
   * Aussprache starten.
   */

  window.speechSynthesis.speak(
    speech
  );

}

let currentQuestion = 0;

let score = 0;

let answered = false;


const personPhoto =

const caption =

    "caption"

const sentenceRest =

const feedback =

const scoreText =

  );

const progressBar =
  document.getElementById(
    "progressBar"
  );

const blank =
  document.getElementById(
    "blank"
  );



/* =====================================================
   CHARGER QUESTION
====================================================== */

function loadQuestion() {

  answered = false;

  const q =
    questions[currentQuestion];


  personPhoto.src =
    q.image;


  caption.textContent =
    q.caption;


  sentenceRest.textContent =
    " " + q.sentence;


  blank.textContent =
    "_____";


  questionNumber.textContent =
    "Frage " +
    (currentQuestion + 1) +
    " von " +
    questions.length;


  scoreText.textContent =
    "Punkte: " +
    score;


  progressBar.style.width =
    (
      (currentQuestion + 1)
      /
      questions.length
      *
      100
    ) + "%";


  feedback.textContent =
    "";


  feedback.className =
    "feedback";


  nextButton.style.display =
    "none";


  answers.innerHTML =
    "";


  q.options.forEach(
    function(option) {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "answer";


      button.textContent =
        option;


      button.onclick =
        function() {

          checkAnswer(
            option,
            button
          );

        };


      answers.appendChild(
        button
      );

    }
  );

}



/* =====================================================
   VERIFIER REPONSE
====================================================== */

function checkAnswer(
  selected,
  button
) {

  if (answered)
    return;


  answered = true;


  const correct =
    questions[
      currentQuestion
    ].answer;


  blank.textContent =
    selected;


  if (
    selected === correct
  ) {

    score++;


    button.classList.add(
      "correct"
    );


    feedback.textContent =
      "✅ Sehr gut! Richtig!";


    feedback.classList.add(
      "success"
    );

  }

  else {

    button.classList.add(
      "wrong"
    );


    feedback.textContent =
      "❌ Nicht ganz. Richtig ist: "
      +
      correct;


    feedback.classList.add(
      "error"
    );


    document
      .querySelectorAll(
        ".answer"
      )
      .forEach(
        function(btn) {

          if (
            btn.textContent ===
            correct
          ) {

            btn.classList.add(
              "correct"
            );

          }

        }
      );

  }


  scoreText.textContent =
    "Punkte: " +
    score;


  /*
   * Aussprache automatique
   * de la bonne réponse.
   */

  const correctButton =
    document.querySelector(
      ".answer.correct"
    );


  if (correctButton) {

    speakPronoun(
      correct,
      document.querySelector(
        ".voice-button"
      ) || {
        classList: {
          add: function(){},
          remove: function(){}
        }
      }
    );

  }


  nextButton.style.display =
    "block";

}



/* =====================================================
   QUESTION SUIVANTE
====================================================== */

nextButton.onclick =
  function() {

    currentQuestion++;


    if (
      currentQuestion <
      questions.length
    ) {

      loadQuestion();

    }

    else {

      showResult();

    }

  };



/* =====================================================
   RESULTAT
====================================================== */

function showResult() {

  const percentage =
    Math.round(
      (
        score /
        questions.length
      ) * 100
    );


  document
    .getElementById(
      "exerciseCard"
    )
    .innerHTML = `

      <div class="result">

        <div
          style="font-size:60px;"
        >
          🎉
        </div>

        <h2>
          Sehr gut!
        </h2>

        <p>
          Du hast die Übung beendet.
        </p>

        <div class="score">

          ${score}
          /
          ${questions.length}

        </div>

        <p>

          Ergebnis:
          <strong>
            ${percentage}%
          </strong>

        </p>

        <button
          class="next"
          onclick="restart()"
        >

          🔄 Noch einmal

        </button>

      </div>

  `;

}



/* =====================================================
   RESTART
====================================================== */

function restart() {

  location.reload();

}



/* =====================================================
   START
====================================================== */

loadQuestion();

</script>


</body>

</html>
