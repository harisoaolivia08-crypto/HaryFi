<!-- =====================================================  
     VERBINDUNG ZU LEKTION 1  
====================================================== -->  

<script>  

    /*  
     * HARYFI  
     *  
     * Die Lektion 1 befindet sich jetzt  
     * in einer eigenen Datei:  
     *  
     * lektion1.html  
     *  
     * Wenn der Benutzer in der A1-Liste  
     * auf "Alphabet & Aussprache" klickt,  
     * wird diese Seite geöffnet.  
     */  


    document.addEventListener(  
        "click",  
        function(event) {  

            /*  
             * Prüfen, ob innerhalb  
             * der Lektionen geklickt wurde.  
             */  

            const element =  
                event.target.closest(  
                    "#lessonList"  
                );  


            if (!element) {  
                return;  
            }  


            /*  
             * Text der angeklickten  
             * Lektion holen.  
             */  

            const text =  
                event.target.textContent  
                .trim()  
                .replace(/\s+/g, " ");  


            /*  
             * Lektion 1 erkennen.  
             */  

            if (  
                text.includes(  
                    "Alphabet & Aussprache"  
                )  
            ) {  

                /*  
                 * Standardverhalten stoppen.  
                 */  

                event.preventDefault();  


                /*  
                 * Neue Lektion-1-Seite öffnen.  
                 */  

                window.location.href =  
                    "lektion1.html";  

            }  

        },  
        true  
    );  

</script>
